# Nivel de cada consumidor externo (HU-17), en peticiones por minuto.
# Niveles posibles: 60, 120, 300, 600, 1000. Una clave que no esté aquí queda en 60.
# Debe coincidir con limite_por_minuto de consumidor_externo.
# Para cambiar un límite: editar la línea y correr
#   docker compose exec nginx nginx -s reload

map $http_x_api_key $nivel_externo {
    default                 60;
    dev-key-universidad     120;
    dev-key-ong             60;
}