resolver 127.0.0.11 valid=10s ipv6=off;

# HU-17: límite de peticiones por consumidor externo 
include /etc/nginx/limites/clientes.conf;

# Cada nivel tiene su propia llave: solo lleva la clave si el cliente es de ese nivel.
# Si la llave queda vacía, Nginx no cuenta esa petición en esa zona.
map $nivel_externo $llave_60   { 60   $http_x_api_key; default ""; }
map $nivel_externo $llave_120  { 120  $http_x_api_key; default ""; }
map $nivel_externo $llave_300  { 300  $http_x_api_key; default ""; }
map $nivel_externo $llave_600  { 600  $http_x_api_key; default ""; }
map $nivel_externo $llave_1000 { 1000 $http_x_api_key; default ""; }

limit_req_zone $llave_60   zone=externo_60:1m   rate=60r/m;
limit_req_zone $llave_120  zone=externo_120:1m  rate=120r/m;
limit_req_zone $llave_300  zone=externo_300:1m  rate=300r/m;
limit_req_zone $llave_600  zone=externo_600:1m  rate=600r/m;
limit_req_zone $llave_1000 zone=externo_1000:1m rate=1000r/m;

upstream api_interna {
    zone api_interna 64k;
    server api-interna:8081 resolve;
}

upstream api_publica {
    zone api_publica 64k;
    server api-publica:8082 resolve;
}
server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-BioHub-Replica $upstream_addr always;

    location /interno/ {
        # HU-01: Nginx por defecto solo deja pasar 1 MB; las evidencias llegan a 10 MB cada una
        client_max_body_size 60m;
        proxy_pass http://api_interna;
    }

    location /publico/ {
        proxy_pass http://api_publica;
    }

    location /externo/ {
    limit_req zone=externo_60   burst=60   nodelay;
    limit_req zone=externo_120  burst=120  nodelay;
    limit_req zone=externo_300  burst=300  nodelay;
    limit_req zone=externo_600  burst=600  nodelay;
    limit_req zone=externo_1000 burst=1000 nodelay;
    limit_req_status 429;

    proxy_pass http://api_publica;
    }

    location / {
        default_type text/plain;
        return 200 "BioHub: el frontend corre en http://localhost:5174\n";
    }
}