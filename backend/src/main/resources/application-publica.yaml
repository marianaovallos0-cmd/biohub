server:
  port: 8082

spring:
  datasource:
    username: ${DB_USER_PUBLICA:biohub_publica}
    password: ${DB_PASSWORD_PUBLICA}
  cache:
    type: redis
    redis:
      time-to-live: 60s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

management:
  health:
    redis:
      enabled: true