resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_interna {
    zone api_interna 64k;
    server api-interna:8081 resolve;
}

upstream api_publica {
    zone api_publica 64k;
    server api-publica:8082 resolve;
}
server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-BioHub-Replica $upstream_addr always;

    location /interno/ {
        proxy_pass http://api_interna;
    }

    location /publico/ {
        proxy_pass http://api_publica;
    }

    location /externo/ {
        proxy_pass http://api_publica;
    }

    location / {
        default_type text/plain;
        return 200 "BioHub: el frontend se conecta en BT-03\n";
    }
}